version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis_password
      POSTGRES_DB: aegis_db
    ports:
      - '5432:5432'
    volumes:
      - aegis_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - aegis_redis_data:/data

volumes:
  aegis_pg_data:
  aegis_redis_data:
